name: Windows checks and source package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Run model, rendering, and Windows component checks
        run: python -m unittest discover -s tests -v
      - name: Validate documentation assets and links
        run: python tools/check_docs.py
      - name: Build source package
        if: matrix.python == '3.14'
        run: python tools/package_source.py
      - name: Upload source and checksum
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GPU-Live-Graphs-source
          path: dist/*
          if-no-files-found: error
  release-preview:
    needs: windows-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: GPU-Live-Graphs-Windows-x64
          path: packages
      - name: Publish a new versioned preview without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c 'from version import VERSION; print(VERSION)')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; published assets are unchanged."
            exit 0
          fi
          gh release create "$tag" packages/*-Windows-x64.zip packages/*-Setup.exe packages/SHA256SUMS-Windows.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "GPU Live Graphs $version preview" --notes-file "docs/RELEASE-$version.md"
  windows-package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build portable app and per-user installer
        run: ./tools/build_windows.ps1
      - name: Verify frozen launch, installation, and uninstallation
        run: ./tools/check_windows_package.ps1
      - name: Upload Windows packages and verification reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GPU-Live-Graphs-Windows-x64
          path: |
            dist/*-Windows-x64.zip
            dist/*-Setup.exe
            dist/SHA256SUMS-Windows.txt
            dist/*-test.json
          if-no-files-found: error
