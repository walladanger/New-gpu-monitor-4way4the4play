name: Windows checks and source package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Run model, rendering, and Windows component checks
        run: python -m unittest discover -s tests -v
      - name: Validate documentation assets and links
        run: python tools/check_docs.py
      - name: Build source package
        if: matrix.python == '3.14'
        run: python tools/package_source.py
      - name: Upload source and checksum
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GPU-Live-Graphs-0.4.1-source
          path: dist/*
          if-no-files-found: error
