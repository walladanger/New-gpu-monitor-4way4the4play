name: Windows checks and source package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Run model, rendering, and Windows component checks
        run: python -m unittest discover -s tests -v
      - name: Validate documentation assets and links
        run: python tools/check_docs.py
      - name: Build source package
        if: matrix.python == '3.14'
        run: python tools/package_source.py
      - name: Upload source and checksum
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GPU-Live-Graphs-source
          path: dist/*
          if-no-files-found: error
  windows-package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build portable app and per-user installer
        run: ./tools/build_windows.ps1
      - name: Verify frozen launch, installation, and uninstallation
        run: ./tools/check_windows_package.ps1
      - name: Upload Windows packages and verification reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GPU-Live-Graphs-Windows-x64
          path: |
            dist/*-Windows-x64.zip
            dist/*-Setup.exe
            dist/SHA256SUMS-Windows.txt
            dist/*-test.json
          if-no-files-found: error
